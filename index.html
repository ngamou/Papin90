    <!-- AI Studio iFrame Resilience: Gracefully handle disabled HMR WebSocket connections -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && typeof e.reason.message === 'string' && e.reason.message.includes('[vite]')) {
              e.preventDefault();
            }
          });
          window.addEventListener('error', function(e) {
            if (e && typeof e.message === 'string' && e.message.includes('[vite]')) {
              e.preventDefault();
            }
          });
        }
      })();
    </script>
